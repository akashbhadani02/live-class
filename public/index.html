<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Class</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
.hidden{display:none!important}.top{padding:14px 18px;background:#111827;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:20px}.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#1f2937}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(520px,100%);background:#111827;border:1px solid #263244;border-radius:18px;padding:24px;box-shadow:0 18px 60px #0006}
h1{margin:0 0 8px}.muted{color:#94a3b8}.row{display:flex;gap:10px}.row>*{flex:1}
input,select,button{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #334155;font-size:15px}
input,select{background:#0b1220;color:#fff}button{cursor:pointer;background:#2563eb;color:#fff;border:0;font-weight:700}
button.secondary{background:#334155}button.danger{background:#dc2626}
label{display:block;margin:16px 0 7px;color:#cbd5e1;font-size:14px}
#classPage{height:100vh;display:flex;flex-direction:column}
.toolbar{padding:10px 14px;background:#111827;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar button{width:auto;padding:9px 13px}.room{flex:1;min-width:140px;color:#94a3b8}
#meet{flex:1;min-height:0;background:#000}
.notice{padding:10px 14px;background:#172033;color:#cbd5e1;font-size:13px}
.controls{display:flex;gap:8px;align-items:center}
@media(max-width:600px){.top{padding:12px}.card{padding:18px}.toolbar button{font-size:12px;padding:8px}.room{font-size:12px}}
</style>
</head>
<body>
<div id="home">
  <div class="top"><div class="brand">🎓 Live Class</div><span class="badge">Jitsi Powered</span></div>
  <div class="page">
    <div class="card">
      <h1>Join Live Class</h1>
      <p class="muted">Camera and microphone are optional. You can still watch and hear the class without them.</p>
      <label>Role</label>
      <select id="role"><option value="teacher">Teacher</option><option value="student">Student</option></select>
      <label>Your Name</label>
      <input id="name" placeholder="Enter your name">
      <label>Class ID</label>
      <input id="room" placeholder="Example: ADUCATE-123">
      <div style="height:14px"></div>
      <div class="row">
        <button id="joinBtn">Join Class</button>
        <button id="randomBtn" class="secondary">Generate ID</button>
      </div>
      <p id="msg" class="muted" style="margin-bottom:0"></p>
    </div>
  </div>
</div>

<div id="classPage" class="hidden">
  <div class="top">
    <div class="brand">🎓 Live Class</div>
    <div class="room" id="roomLabel"></div>
    <div class="controls">
      <button id="raiseBtn">🙋 Raise Hand</button>
      <button id="leaveBtn" class="danger">Leave</button>
    </div>
  </div>
  <div class="notice" id="status">
    Camera/mic are optional. Use Jitsi's controls to enable them when available.
  </div>
  <div id="meet"></div>
</div>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
let api = null, role = "student", displayName = "", roomName = "", handRaised = false;

const $ = id => document.getElementById(id);
function setMsg(t){ $("msg").textContent = t; }

$("randomBtn").onclick = () => {
  $("room").value = "ADUCATE-" + Math.random().toString(36).slice(2,8).toUpperCase();
};

$("joinBtn").onclick = () => {
  displayName = $("name").value.trim() || (role === "teacher" ? "Teacher" : "Student");
  role = $("role").value;
  roomName = $("room").value.trim().replace(/[^a-zA-Z0-9_-]/g,"");
  if(!roomName){ setMsg("Please enter a Class ID."); return; }
  join();
};

$("raiseBtn").onclick = () => {
  if(!api) return;
  handRaised = !handRaised;
  api.executeCommand("toggleRaiseHand");
  $("raiseBtn").textContent = handRaised ? "👇 Lower Hand" : "🙋 Raise Hand";
};

$("leaveBtn").onclick = () => {
  if(api){ api.dispose(); api = null; }
  $("classPage").classList.add("hidden");
  $("home").classList.remove("hidden");
  $("meet").innerHTML = "";
  handRaised = false;
  $("raiseBtn").textContent = "🙋 Raise Hand";
};

function join(){
  $("home").classList.add("hidden");
  $("classPage").classList.remove("hidden");
  $("roomLabel").textContent = "Class: " + roomName;

  // Public Jitsi Meet requires no API key/secret in this app.
  api = new JitsiMeetExternalAPI("meet.jit.si", {
    roomName: "AducateLive_" + roomName,
    parentNode: $("meet"),
    width: "100%",
    height: "100%",
    userInfo: { displayName },
    configOverwrite: {
      prejoinPageEnabled: false,
      disableDeepLinking: true,
      startWithAudioMuted: true,
      startWithVideoMuted: true
    },
    interfaceConfigOverwrite: {
      TOOLBAR_BUTTONS: [
        "microphone","camera","desktop","fullscreen","hangup",
        "chat","raisehand","tileview","participants-pane"
      ],
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false
    }
  });

  api.addEventListener("videoConferenceJoined", () => {
    $("status").textContent =
      role === "teacher"
      ? "👨‍🏫 Teacher joined. Students can use Raise Hand from the class controls."
      : "👨‍🎓 Student joined. Raise your hand when you want to speak.";
  });

  api.addEventListener("participantJoined", e => {
    // Jitsi handles remote audio/video automatically.
    console.log("Participant joined", e);
  });

  api.addEventListener("participantLeft", e => {
    console.log("Participant left", e);
  });

  api.addEventListener("readyToClose", () => {
    $("leaveBtn").click();
  });
}
</script>
</body>
</html>
